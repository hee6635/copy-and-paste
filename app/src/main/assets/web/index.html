<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>링크메모</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="ai.css">
<link rel="stylesheet" href="tidy.css">
</head>
<body>

<!-- 홈 -->
<main id="home" class="page">
  <header class="top selhead">
    <button class="ib" id="selX" aria-label="고르기 끝"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <b id="selCount">0개 선택</b>
    <button class="txtbtn" id="selAll">전체 선택</button>
  </header>
  <header class="top normhead">
    <h1>링크메모</h1>
    <button class="ib" id="btnSize" aria-label="카드 크기"></button>
    <button class="ib" id="btnTidy" aria-label="한 장씩 정리"><svg class="ic" viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="16" rx="3"/><path d="M3 8v8M21 8v8"/></svg></button>
    <button class="ib" id="btnSettings" aria-label="설정"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
  </header>
  <label class="search"><svg class="ic s" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="검색" autocomplete="off"><button class="ib x hide" id="qClear" aria-label="지우기"><svg class="ic s" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></label>
  <nav class="kgrid" id="cats"></nav>
  <nav class="pills" id="chips"></nav>
  <nav class="pills sub" id="chips2"></nav>
  <section id="jobs"></section>
  <section class="cols" id="grid"><div class="col"></div><div class="col"></div></section>
  <div class="empty hide" id="empty">
    <svg class="ic big" viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
    <b>인스타 · 유튜브에서 공유 → 링크메모</b>
  </div>
  <nav class="bar5 selbar" id="selBar">
    <button id="sMove"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M10 13h6M13 10l3 3-3 3"/></svg>폴더 이동</button>
    <button id="sOrder"><svg class="ic" viewBox="0 0 24 24"><path d="M8 4v16M4 8l4-4 4 4M16 20V4M12 16l4 4 4-4"/></svg>순서 바꾸기</button>
    <button id="sShare"><svg class="ic" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg>공유</button>
    <button id="sDel" class="danger"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>삭제</button>
  </nav>
  <div class="dock normdock">
    <div class="seg2" id="dockSeg"><button data-dm="save" class="on">저장</button><button data-dm="ask">질문</button></div>
    <div class="inrow">
      <input id="paste" class="inp" type="url" placeholder="링크 붙여넣기" autocomplete="off">
      <button class="send" id="pasteGo" aria-label="저장"><i></i><svg class="ic" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
  </div>
</main>

<!-- 상세 -->
<section id="detail" class="page sub" aria-hidden="true">
  <header class="top c dtop">
    <button class="ib" data-back aria-label="뒤로"><svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="t" id="dTopTitle"></div>
    <div class="acts">
      <button class="ib" id="aOpen" aria-label="링크로 이동"><svg class="ic" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
      <button class="ib" id="aShare" aria-label="공유"><svg class="ic" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg></button>
      <button class="ib" id="aCopy" aria-label="복사"><svg class="ic" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h9"/></svg></button>
      <button class="ib" id="aMore" aria-label="더 보기"><svg class="ic" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
    </div>
  </header>
  <div class="scroll" id="dScroll"></div>
  <form class="dask" id="dAskF"><input id="dAskQ" type="text" placeholder="이 링크에 대해 물어보기" autocomplete="off"><button aria-label="보내기"><svg class="ic" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></form>
</section>

<!-- 캡처 보기 -->
<section id="capView" class="page sub" aria-hidden="true">
  <header class="top c">
    <button class="ib" data-back aria-label="닫기"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="t" id="cTitle"></div>
    <button class="ib" id="cGallery" aria-label="갤러리에 저장"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
  </header>
  <div class="scroll" id="cScroll"></div>
  <div class="dock solid"><div class="inrow">
    <button class="inp btn" id="cPlay">이 장면부터 재생</button>
    <button class="round" id="cDel" aria-label="캡처 지우기"><svg class="ic danger" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
  </div></div>
</section>

<!-- 설정 -->
<section id="tidy" class="page sub" aria-hidden="true">
  <header class="top c">
    <button class="ib" data-back aria-label="닫기"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="t" id="tdN"></div>
    <button class="ib" id="tdUndo" aria-label="되돌리기"><svg class="ic" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  </header>
  <div class="tbar"><i id="tdBar"></i></div>
  <div class="tstack" id="tdStack"></div>
  <div class="tbtns" id="tdBtns"><button class="tb del" id="tdDel">지우기</button><button class="tb go" id="tdGo">두기</button></div>
</section>
<section id="settings" class="page sub" aria-hidden="true">
  <header class="top c">
    <button class="ib" data-back aria-label="뒤로"><svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="t">설정</div><div class="ib"></div>
  </header>
  <div class="scroll" id="sScroll"></div>
</section>

<!-- 검사 -->
<section id="diag" class="page sub" aria-hidden="true">
  <header class="top c">
    <button class="ib" data-back aria-label="뒤로"><svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="t">검사</div><div class="ib"></div>
  </header>
  <div class="scroll">
    <div class="sec" style="margin-top:4px">
      <label class="field" style="margin-top:0"><input id="dgUrl" type="url" placeholder=" " autocomplete="off"><span>검사할 링크</span></label>
    </div>
    <div class="group steps" id="dgSteps"></div>
  </div>
  <div class="dock solid"><div class="inrow">
    <button class="inp btn" id="dgCopy">결과 복사</button>
    <button class="send on" id="dgGo" aria-label="검사 시작"><i></i><svg class="ic" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
  </div></div>
</section>

<!-- 순서 바꾸기 -->
<section id="order" class="page sub" aria-hidden="true">
  <header class="top c">
    <button class="ib" data-back aria-label="취소"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="t">순서 바꾸기</div>
    <button class="txtbtn" id="ordDone">완료</button>
  </header>
  <div class="scroll"><div id="ordList" class="ordlist"></div></div>
</section>

<!-- 잘라쓰기 -->
<section id="crop" class="page sub dark" aria-hidden="true">
  <header class="top c">
    <button class="ib" data-back aria-label="닫기"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="t" id="cropTitle">잘라쓰기</div><div class="ib"></div>
  </header>
  <div class="cropwrap" id="cropWrap"><img id="cropImg" alt=""><div class="cropbox" id="cropBox"><i data-h="tl"></i><i data-h="tr"></i><i data-h="bl"></i><i data-h="br"></i></div></div>
  <div class="cbar"><button class="cfull" id="cropFull">전체 그대로</button><button class="cok" id="cropOk">자르기</button></div>
</section>

<!-- 캡처 고르기 -->
<section id="capsel" class="page sub" aria-hidden="true">
  <header class="top c">
    <button class="ib" data-back aria-label="닫기"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="t" id="csCount">0개 선택</div>
    <button class="txtbtn" id="csAll">전체</button>
  </header>
  <div class="scroll"><div class="cg" id="csGrid"></div></div>
  <nav class="bar5 bar2">
    <button id="csMove"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>다른 줄로 옮기기</button>
    <button id="csDel" class="danger"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>지우기</button>
  </nav>
</section>

<!-- 질문하기 -->
<section id="askPage" class="page sub" aria-hidden="true">
  <header class="top c">
    <button class="ib" data-back aria-label="뒤로"><svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="t">질문</div>
    <button class="txtbtn" id="askClear">새로</button>
  </header>
  <div class="scroll" id="askLog"></div>
  <div class="dock solid"><div class="inrow">
    <input id="askQ" class="inp" placeholder="저장한 것에 물어보기" autocomplete="off">
    <button class="send on" id="askSend" aria-label="묻기"><i></i><svg class="ic" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </div></div>
</section>

<!-- 요약 슬라이드 -->
<section id="slides" class="page sub dark" aria-hidden="true">
  <header class="top c">
    <button class="ib" data-back aria-label="닫기"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="t" id="slTitle"></div><div class="ib"></div>
  </header>
  <div class="sltrack" id="slTrack"></div>
  <div class="sldots" id="slDots"></div>
</section>

<!-- AI 사용량 -->
<section id="usagePage" class="page sub" aria-hidden="true">
  <header class="top c">
    <button class="ib" data-back aria-label="뒤로"><svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="t">AI 사용량</div><div class="ib"></div>
  </header>
  <div class="scroll" id="usScroll"></div>
</section>

<div id="dim" class="dim"></div>

<!-- 폴더로 옮기기 -->
<section id="moveSheet" class="sheet" aria-hidden="true">
  <div class="grab"></div>
  <div class="stitle" id="mvTitle">폴더</div>
  <div class="flist" id="mvList"></div>
  <button class="bigbtn gray" id="mvNew">＋ 새 폴더</button>
</section>

<!-- 붙일 곳 -->
<section id="attSheet" class="sheet" aria-hidden="true">
  <div class="grab"></div>
  <div class="stitle">어디에 붙일까요?</div>
  <div class="attprev"><img id="attImg" alt=""><span id="attInfo"></span></div>
  <div class="olist attlist" id="attList"></div>
  <button class="bigbtn" id="attGo">붙이기</button>
</section>

<!-- 고르기 창 -->
<section id="optSheet" class="sheet" aria-hidden="true">
  <div class="grab"></div>
  <div class="stitle" id="optTitle"></div>
  <div class="olist" id="optList"></div>
</section>

<!-- 저장 창 -->
<section id="saveSheet" class="sheet" aria-hidden="true">
  <div class="grab"></div>
  <div class="mini"><div class="mt" id="ssIcon"></div><div class="mtxt"><b id="ssHost"></b><span id="ssUrl"></span></div></div>
  <div id="ssModeWrap">
    <div class="lbl">저장 방식</div>
    <div class="choose" id="ssMode"><i></i><button data-v="video">영상까지</button><button data-v="link">링크만</button></div>
  </div>
  <label class="field"><input id="ssMemo" placeholder=" " autocomplete="off"><span>한 줄 메모</span></label>
  <button class="bigbtn" id="ssGo">저장</button>
</section>

<!-- 작은 입력 창 (태그 추가 등) -->
<section id="askSheet" class="sheet" aria-hidden="true">
  <div class="grab"></div>
  <div class="stitle" id="askTitle"></div>
  <label class="field"><input id="askInput" placeholder=" " autocomplete="off"><span id="askLabel"></span></label>
  <button class="bigbtn" id="askGo">확인</button>
</section>

<!-- 확인 창 -->
<section id="confirmSheet" class="sheet" aria-hidden="true">
  <div class="grab"></div>
  <div class="stitle" id="cfTitle"></div>
  <div class="two"><button class="bigbtn gray" id="cfNo">취소</button><button class="bigbtn red" id="cfYes">지우기</button></div>
</section>

<div id="toast" class="toast"></div>

<script src="js/dev.js"></script>
<script src="js/core.js"></script>
<script src="js/home.js"></script>
<script src="js/save.js"></script>
<script src="js/detail.js"></script>
<script src="js/ai.js"></script>
<script src="js/capture.js"></script>
<script src="js/settings.js"></script>
<script src="js/ask.js"></script>
<script src="js/slides.js"></script>
<script src="js/share.js"></script>
<script src="js/tidy.js"></script>
<script src="js/main.js"></script>
</body>
</html>
